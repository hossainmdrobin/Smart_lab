  <!-- Nodes -->
  <g filter="url(#soft)" opacity="0.95">
    <g>
      <circle cx="180" cy="420" r="22" fill="#0E7C7B"/>
      <circle cx="180" cy="420" r="40" fill="#0E7C7B" opacity="0.08"/>
    </g>
    <g>
      <circle cx="450" cy="370" r="22" fill="#13B8A6"/>
      <circle cx="450" cy="370" r="40" fill="#13B8A6" opacity="0.08"/>
    </g>
    <g>
      <circle cx="650" cy="540" r="22" fill="#55C6D8"/>
      <circle cx="650" cy="540" r="40" fill="#55C6D8" opacity="0.08"/>
    </g>
    <g>
      <circle cx="1020" cy="610" r="22" fill="#55C6D8"/>
      <circle cx="1020" cy="610" r="40" fill="#55C6D8" opacity="0.08"/>
    </g>
    <g>
      <circle cx="740" cy="260" r="22" fill="#0E7C7B"/>
      <circle cx="740" cy="260" r="40" fill="#0E7C7B" opacity="0.08"/>
