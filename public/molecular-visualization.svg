  <!-- Label -->
  <g>
    <rect x="60" y="60" rx="16" ry="16" width="360" height="66" fill="#FFFFFF" opacity="0.9" stroke="#E2E8F0"/>
    <text x="92" y="102" font-family="Arial" font-size="18" fill="#64748B" font-weight="700">Scientific visualization pending approval</text>
