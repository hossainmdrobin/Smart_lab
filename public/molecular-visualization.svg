    <g>
      <circle cx="810" cy="650" r="22" fill="#0E7C7B"/>
      <circle cx="810" cy="650" r="40" fill="#0E7C7B" opacity="0.08"/>
    </g>
    <g>
      <circle cx="520" cy="600" r="22" fill="#13B8A6"/>
      <circle cx="520" cy="600" r="40" fill="#13B8A6" opacity="0.08"/>
